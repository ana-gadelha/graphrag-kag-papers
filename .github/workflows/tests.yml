name: Application tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/integration-test-password
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-test-password 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      NEO4J_URI: bolt://127.0.0.1:17687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: integration-test-password
      NEO4J_DATABASE: neo4j
      TEST_NEO4J_URI: bolt://127.0.0.1:17687
      TEST_NEO4J_USERNAME: neo4j
      TEST_NEO4J_PASSWORD: integration-test-password
      TEST_NEO4J_DATABASE: neo4j
      TOKENIZERS_PARALLELISM: "false"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt coverage
      - name: Unit, UI and isolated database tests
        run: |
          python -m coverage run --branch --source=src,retrieval,app_integration,run_pipeline -m unittest discover -s tests -v
          python -m coverage report
      - name: Build complete corpus and validate embeddings
        run: python run_pipeline.py --provider curated --import-neo4j --index-embeddings
      - name: Verify retrieval with the real local encoder and database
        run: python tests/smoke_retrieval.py
      - name: Check syntax and whitespace
        run: |
          python -m compileall -q src retrieval tests app.py app_integration.py run_pipeline.py extraction
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            output/validation_report.json
            output/extraction_report.json
            output/graph_validation_report.json
