<section class="evidence-graph" data-graph-root>
  <div class="graph-toolbar">
    <div class="graph-help">
      <strong>Explore o subgrafo</strong>
      <span>Arraste nós · arraste o fundo para mover · use a roda do mouse para zoom</span>
    </div>
    <div class="graph-actions">
      <div class="path-controls" role="group" aria-label="Destacar caminho"></div>
      <button class="reset-view" type="button">Centralizar</button>
    </div>
  </div>
  <div class="graph-layout">
    <div class="graph-canvas" role="img" aria-label="Grafo interativo de evidências"></div>
    <aside class="graph-detail" aria-live="polite">
      <p class="detail-eyebrow">Inspeção</p>
      <h3 class="detail-title">Selecione um nó ou uma relação</h3>
      <div class="detail-content">
        <p>As propriedades e a proveniência aparecem aqui.</p>
      </div>
    </aside>
  </div>
  <div class="graph-footer">
    <div class="graph-legend" aria-label="Legenda"></div>
    <span class="graph-summary"></span>
  </div>
</section>
